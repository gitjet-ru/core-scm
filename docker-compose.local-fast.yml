# Fast local rebuild of gitea (~2–5 min with warm go mod + go-build cache): skips webpack inside Docker.
#
# Prerequisite (once per frontend change):
#   cd core-scm && make frontend
#
# Build + run (default stack, без сервиса git-storage):
#   docker compose -f docker-compose.yml -f docker-compose.local-fast.yml build gitea
#   docker compose -f docker-compose.yml -f docker-compose.local-fast.yml up -d
#
# Optional remote-storage overlay (отдельный контейнер git-storage):
#   docker compose -f docker-compose.yml -f docker-compose.git-storage.yml -f docker-compose.local-fast.yml build gitea
#
# "prebuilt" is relative to this compose file: core-scm/public/assets after make frontend.
services:
  gitea:
    build:
      target: gitea-fast
      additional_contexts:
        prebuilt: ./public/assets
