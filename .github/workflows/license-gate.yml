name: license-gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  license-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run license gate
        run: node tools/license-gate.mjs
