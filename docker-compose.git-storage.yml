# Overlay: run external git-storage service and route bare repo ops via gRPC.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.git-storage.yml up -d --build
#
# Rollback:
#   set GIT_STORAGE_BACKEND=local (or remove these vars) and restart gitea.

services:
  git-storage:
    build:
      context: ../git-storage
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      GIT_STORAGE_ADDR: ":9093"
      GIT_STORAGE_ROOT: /var/lib/git-storage/repos
      GIT_STORAGE_MAX_INFLIGHT: ${GIT_STORAGE_MAX_INFLIGHT:-200}
      GIT_STORAGE_SANITIZE_BROKEN_REFS: ${GIT_STORAGE_SANITIZE_BROKEN_REFS:-0}
      # S3-backed storage for bare repos (Selectel-compatible).
      GIT_STORAGE_S3_ENDPOINT: ${GIT_STORAGE_S3_ENDPOINT:-}
      GIT_STORAGE_S3_REGION: ${GIT_STORAGE_S3_REGION:-}
      GIT_STORAGE_S3_BUCKET: ${GIT_STORAGE_S3_BUCKET:-}
      GIT_STORAGE_S3_PREFIX: ${GIT_STORAGE_S3_PREFIX:-repos}
      GIT_STORAGE_S3_USE_SSL: ${GIT_STORAGE_S3_USE_SSL:-1}
      GIT_STORAGE_S3_PATH_STYLE: ${GIT_STORAGE_S3_PATH_STYLE:-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    ports:
      - "9093:9093"
    volumes:
      - git_storage_data:/var/lib/git-storage/repos

  gitea:
    build:
      context: ..
      dockerfile: core-scm/Dockerfile
      target: gitea
      args:
        SRC_ROOT: core-scm
    depends_on:
      git-storage:
        condition: service_started
    environment:
      GIT_STORAGE_BACKEND: ${GIT_STORAGE_BACKEND:-local}
      GIT_STORAGE_ENDPOINT: ${GIT_STORAGE_ENDPOINT:-git-storage:9093}
      GIT_STORAGE_TIMEOUTS: ${GIT_STORAGE_TIMEOUTS:-120s}
      GIT_STORAGE_LOCAL_CACHE_TTL: ${GIT_STORAGE_LOCAL_CACHE_TTL:-2m}
      GIT_STORAGE_READ_BACKEND: ${GIT_STORAGE_READ_BACKEND:-remote}
      GIT_STORAGE_TLS_CA_FILE: ${GIT_STORAGE_TLS_CA_FILE:-}
      GIT_STORAGE_TLS_CERT_FILE: ${GIT_STORAGE_TLS_CERT_FILE:-}
      GIT_STORAGE_TLS_KEY_FILE: ${GIT_STORAGE_TLS_KEY_FILE:-}
      GIT_STORAGE_TLS_SERVER_NAME: ${GIT_STORAGE_TLS_SERVER_NAME:-}
      # Blob storage (LFS/attachments/packages/avatars) via S3/MinIO.
      GITEA__storage__STORAGE_TYPE: ${GITEA_BLOB_STORAGE_TYPE:-local}
      GITEA__storage__MINIO_ENDPOINT: ${GIT_STORAGE_S3_ENDPOINT:-}
      GITEA__storage__MINIO_LOCATION: ${GIT_STORAGE_S3_REGION:-}
      GITEA__storage__MINIO_BUCKET: ${GITEA_BLOB_S3_BUCKET:-gitea}
      GITEA__storage__MINIO_USE_SSL: ${GIT_STORAGE_S3_USE_SSL:-1}
      GITEA__storage__MINIO_BUCKET_LOOKUP_TYPE: ${GITEA_BLOB_S3_BUCKET_LOOKUP_TYPE:-auto}
      GITEA__storage__MINIO_BASE_PATH: ${GITEA_BLOB_S3_PREFIX:-gitea}
      GITEA__storage__MINIO_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      GITEA__storage__MINIO_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      GITEA__lfs__MINIO_BASE_PATH: ${GITEA_BLOB_S3_PREFIX:-gitea}/lfs/
      GITEA__attachment__MINIO_BASE_PATH: ${GITEA_BLOB_S3_PREFIX:-gitea}/attachments/
      GITEA__avatars__MINIO_BASE_PATH: ${GITEA_BLOB_S3_PREFIX:-gitea}/avatars/
      GITEA__repo-avatars__MINIO_BASE_PATH: ${GITEA_BLOB_S3_PREFIX:-gitea}/repo-avatars/
      GITEA__packages__MINIO_BASE_PATH: ${GITEA_BLOB_S3_PREFIX:-gitea}/packages/

volumes:
  git_storage_data:
