tasks:
  - name: Setup
    init: |
      cp -r contrib/ide/vscode .vscode
      make deps
      make build
    command: |
      gp sync-done setup
      exit 0
  - name: Run backend
    command: |
      gp sync-await setup

      # Get the URL and extract the domain
      url=$(gp url 3000)
      domain=$(echo $url | awk -F[/:] '{print $4}')

      if [ -f custom/conf/app.ini ]; then
        sed -i "s|^ROOT_URL =.*|ROOT_URL = ${url}/|" custom/conf/app.ini
        sed -i "s|^DOMAIN =.*|DOMAIN = ${domain}|" custom/conf/app.ini
        sed -i "s|^SSH_DOMAIN =.*|SSH_DOMAIN = ${domain}|" custom/conf/app.ini
        sed -i "s|^NO_REPLY_ADDRESS =.*|SSH_DOMAIN = noreply.${domain}|" custom/conf/app.ini
      else
        mkdir -p custom/conf/
        echo -e "[server]\nROOT_URL = ${url}/" > custom/conf/app.ini
        echo -e "\n[database]\nDB_TYPE = postgres\nHOST = 127.0.0.1:5432\nNAME = gitea\nUSER = gitea\nPASSWD = gitea\nSSL_MODE = disable" >> custom/conf/app.ini
      fi
      export TAGS=""
      make watch-backend
  - name: Run frontend
    command: |
      gp sync-await setup
      make watch-frontend
    openMode: split-right

vscode:
  extensions:
    - editorconfig.editorconfig
    - dbaeumer.vscode-eslint
    - golang.go
    - stylelint.vscode-stylelint
    - DavidAnson.vscode-markdownlint
    - Vue.volar
    - ms-azuretools.vscode-docker
    - vitest.explorer
    - cweijan.vscode-database-client2
    - GitHub.vscode-pull-request-github

ports:
  - name: Gitea
    port: 3000
