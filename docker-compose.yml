# Локальный запуск: single PostgreSQL 17 + образ core-scm (без сервиса git-storage).
# Сборка из корня монорепы: context = родитель каталога core-scm, чтобы Dockerfile видел
# соседний git-storage (Go replace), см. Dockerfile build-env-base.
# Запуск из каталога core-scm: docker compose up -d --build
# UI: http://localhost:3000/

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gitea}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gitea}
      POSTGRES_DB: ${POSTGRES_DB:-gitea}
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U ${POSTGRES_USER:-gitea} -d ${POSTGRES_DB:-gitea}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 90s

  gitea:
    build:
      context: ..
      dockerfile: core-scm/Dockerfile
      target: gitea
      args:
        TAGS: ""
        SRC_ROOT: core-scm
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgres
      DB_HOST: postgres:5432
      DB_NAME: ${POSTGRES_DB:-gitea}
      DB_USER: ${POSTGRES_USER:-gitea}
      DB_PASSWD: ${POSTGRES_PASSWORD:-gitea}
      # Override persisted /data/gitea/conf/app.ini values from old spilo setup.
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres:5432
      GITEA__database__NAME: ${POSTGRES_DB:-gitea}
      GITEA__database__USER: ${POSTGRES_USER:-gitea}
      GITEA__database__PASSWD: ${POSTGRES_PASSWORD:-gitea}
      GITEA__database__SSL_MODE: disable
      GITEA__security__INSTALL_LOCK: "true"
      DOMAIN: ${DOMAIN:-localhost}
      SSH_DOMAIN: ${SSH_DOMAIN:-localhost}
      HTTP_PORT: "3000"
      ROOT_URL: ${ROOT_URL:-http://localhost:3000/}
      DISABLE_SSH: ${DISABLE_SSH:-false}
      SSH_PORT: ${SSH_PORT:-22}
      SSH_LISTEN_PORT: ${SSH_LISTEN_PORT:-22}
    ports:
      - "${HTTP_PUBLISH_PORT:-3000}:3000"
      - "${SSH_PUBLISH_PORT:-22}:22"
    volumes:
      - gitea_data:/data

volumes:
  postgres_data:
  gitea_data:
