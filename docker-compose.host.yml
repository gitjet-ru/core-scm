# Запуск на хосте: только core-scm (Gitea), PostgreSQL снаружи.
# БД по умолчанию: 10.0.185.2:5432 (переопределите DB_HOST при необходимости).
# Сборка: docker compose -f docker-compose.host.yml up -d --build
# UI: http://localhost:3000/

services:
  gitea:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GOLANG_BASE_REF: ${GOLANG_BASE_REF:-registry.gitjet.ru/go:1.26.1}
        ALPINE_BASE_REF: ${ALPINE_BASE_REF:-registry.gitjet.ru/alpine:3.23}
        TAGS: ""
    restart: unless-stopped
    environment:
      DB_TYPE: postgres
      DB_HOST: ${DB_HOST:-10.0.185.2:5432}
      DB_NAME: ${POSTGRES_DB:-gitea}
      DB_USER: ${POSTGRES_USER:-gitea}
      DB_PASSWD: ${POSTGRES_PASSWORD:-gitea}
      GITEA__database__SSL_MODE: ${GITEA__database__SSL_MODE:-disable}
      DOMAIN: ${DOMAIN:-localhost}
      SSH_DOMAIN: ${SSH_DOMAIN:-localhost}
      HTTP_PORT: "3000"
      ROOT_URL: ${ROOT_URL:-http://localhost:3000/}
      DISABLE_SSH: ${DISABLE_SSH:-false}
      SSH_PORT: ${SSH_PORT:-22}
      SSH_LISTEN_PORT: ${SSH_LISTEN_PORT:-22}
    ports:
      - "${HTTP_PUBLISH_PORT:-3000}:3000"
      - "${SSH_PUBLISH_PORT:-2222}:22"
    volumes:
      - gitea_data:/data

volumes:
  gitea_data:
